version: '3.8'
services:
  control-api:
    build: ./bases/orchestrix-control-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
  gui:
    build: ./components/gui
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
